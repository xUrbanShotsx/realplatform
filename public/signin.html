<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in &mdash; Real Platform</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  min-height:100dvh;
  background:
    radial-gradient(ellipse 80% 60% at 15% 80%, oklch(0.535 0.218 264 / .28) 0%, transparent 60%),
    radial-gradient(ellipse 55% 45% at 85% 15%, oklch(0.56 0.295 335 / .12) 0%, transparent 55%),
    oklch(0.068 0 0);
  color: oklch(0.965 0 0);
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ── Tokens ── */
:root{
  --primary:    oklch(0.535 0.218 264);
  --accent:     oklch(0.560 0.295 335);
  --surface:    oklch(0.108 0.008 264);
  --border:     oklch(0.200 0.007 264);
  --border-hi:  oklch(0.300 0.010 264);
  --muted:      oklch(0.560 0 0);
  --r:          6px;
  --r-pill:     9999px;
}

/* ── Nav ── */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.25rem clamp(1.25rem,5vw,3.5rem);
  flex-shrink:0;
}
.nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:inherit}
.nav-logo-mark{
  width:1.75rem;height:1.75rem;background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:.58rem;font-weight:800;color:oklch(.97 0 0);letter-spacing:-.02em;
  border-radius:var(--r);flex-shrink:0;
}
.nav-logo-name{font-size:.9375rem;font-weight:600;letter-spacing:-.015em}
.nav-back{
  font-size:.8125rem;color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:.35rem;
  transition:color .18s;
}
.nav-back:hover{color:oklch(0.965 0 0)}
.nav-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Main ── */
main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:2rem clamp(1.25rem,5vw,3.5rem) 4rem;
}

/* ── Card ── */
.card{
  width:100%;max-width:420px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:2.5rem 2rem;
  position:relative;
}
/* subtle glow behind card */
.card::before{
  content:'';position:absolute;inset:-1px;border-radius:15px;
  background:linear-gradient(135deg,oklch(0.535 0.218 264 / .25) 0%, transparent 50%);
  pointer-events:none;z-index:-1;filter:blur(24px);
}

.card-eyebrow{
  display:flex;align-items:center;gap:.5rem;
  margin-bottom:1.5rem;
}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.eyebrow-text{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

h1{
  font-size:1.625rem;font-weight:300;letter-spacing:-.03em;
  line-height:1.15;margin-bottom:.5rem;
}
.card-sub{font-size:.875rem;color:var(--muted);margin-bottom:2rem;line-height:1.5}
.card-sub a{color:var(--primary);text-decoration:none}
.card-sub a:hover{text-decoration:underline}

/* ── Form ── */
.form-group{margin-bottom:1rem}
label{
  display:block;font-size:.75rem;font-weight:600;
  color:oklch(0.70 0.005 264);letter-spacing:.01em;margin-bottom:.4rem;
}
input[type="email"],
input[type="password"]{
  width:100%;
  background:oklch(0.085 0.006 264);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:.7rem .9rem;
  font:inherit;font-size:.9rem;
  color:oklch(0.965 0 0);
  outline:none;
  transition:border-color .18s, box-shadow .18s;
}
input::placeholder{color:oklch(0.38 0 0)}
input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px oklch(0.535 0.218 264 / .18);
}

.form-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.form-row label{margin-bottom:0}
.forgot{font-size:.75rem;color:var(--muted);text-decoration:none;transition:color .18s}
.forgot:hover{color:oklch(0.965 0 0)}

/* ── Submit ── */
.btn-submit{
  width:100%;margin-top:1.5rem;
  background:var(--primary);color:oklch(0.97 0 0);
  border:none;border-radius:var(--r-pill);
  padding:.8rem 1.5rem;
  font:inherit;font-size:.9rem;font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  transition:background .2s, box-shadow .2s, transform .1s;
  position:relative;overflow:hidden;
}
.btn-submit:hover{background:oklch(0.47 0.22 264);box-shadow:0 0 24px oklch(0.535 0.218 264 / .4)}
.btn-submit:active{transform:scale(0.985)}
.btn-submit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.btn-submit:hover svg{transform:translateX(3px)}

/* Loading spinner */
.btn-submit .spinner{
  display:none;width:16px;height:16px;
  border:2px solid oklch(1 0 0 / .3);border-top-color:oklch(1 0 0);
  border-radius:50%;animation:spin .6s linear infinite;
}
.btn-submit.loading .spinner{display:block}
.btn-submit.loading .btn-label,.btn-submit.loading .btn-arrow{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Divider ── */
.divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0;color:oklch(0.32 0.004 264);font-size:.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── SSO ── */
.btn-sso{
  width:100%;
  background:transparent;
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:.7rem 1rem;
  font:inherit;font-size:.875rem;font-weight:500;color:oklch(0.75 0 0);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  transition:border-color .18s, color .18s, background .18s;
}
.btn-sso:hover{border-color:var(--border-hi);color:oklch(0.965 0 0);background:oklch(1 0 0 / .03)}
.btn-sso svg{width:18px;height:18px;flex-shrink:0}

/* ── Footer note ── */
.card-footer{
  margin-top:1.75rem;text-align:center;
  font-size:.75rem;color:oklch(0.42 0.003 264);line-height:1.6;
}
.card-footer a{color:var(--muted);text-decoration:none}
.card-footer a:hover{color:oklch(0.965 0 0)}

/* ── Error message ── */
.error-msg{
  display:none;
  background:oklch(0.35 0.12 27 / .2);
  border:1px solid oklch(0.55 0.18 27 / .5);
  border-radius:var(--r);
  padding:.6rem .85rem;
  font-size:.8125rem;color:oklch(0.75 0.12 27);
  margin-bottom:1rem;
  align-items:center;gap:.5rem;
}
.error-msg.visible{display:flex}
.error-msg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

/* ── Animation ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .55s ease-out forwards}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <div class="nav-logo-mark">RP</div>
    <span class="nav-logo-name">Real Platform</span>
  </a>
  <a href="/" class="nav-back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back to site
  </a>
</nav>

<main>
  <div class="card">

    <div class="card-eyebrow">
      <div class="eyebrow-dot"></div>
      <span class="eyebrow-text">Secure sign in</span>
    </div>

    <h1>Welcome back</h1>
    <p class="card-sub">Don&rsquo;t have an account? <a href="#">Start free trial</a></p>

    <div class="error-msg" id="errorMsg">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Incorrect email or password. Try again.
    </div>

    <form id="signinForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@agency.com.au" autocomplete="email" required>
      </div>

      <div class="form-group">
        <div class="form-row">
          <label for="password">Password</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="spinner"></div>
        <span class="btn-label">Sign in</span>
        <svg class="btn-arrow" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="divider">or continue with</div>

    <button class="btn-sso" type="button" onclick="handleSSO()">
      <!-- Google icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="card-footer">
      By signing in you agree to our <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>
    </div>

  </div>
</main>

<script>
const DASHBOARD_URL = 'http://localhost:3000/dashboard';

// Demo credentials — any email + password "demo" signs in
const DEMO_PASSWORD = 'demo';

const form       = document.getElementById('signinForm');
const submitBtn  = document.getElementById('submitBtn');
const errorMsg   = document.getElementById('errorMsg');
const emailInput = document.getElementById('email');
const passInput  = document.getElementById('password');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  errorMsg.classList.remove('visible');

  const email = emailInput.value.trim();
  const pass  = passInput.value;

  if (!email || !pass) return;

  // Loading state
  submitBtn.classList.add('loading');
  submitBtn.disabled = true;

  setTimeout(function() {
    // Accept: demo password OR any non-empty credentials
    // In production this would hit an API
    if (pass === DEMO_PASSWORD || pass.length >= 1) {
      // Success — redirect to dashboard
      window.location.href = DASHBOARD_URL;
    } else {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
      errorMsg.classList.add('visible');
      passInput.value = '';
      passInput.focus();
    }
  }, 900);
});

function handleSSO() {
  submitBtn.disabled = true;
  window.location.href = DASHBOARD_URL;
}

// Clear error on input
[emailInput, passInput].forEach(function(el) {
  el.addEventListener('input', function() {
    errorMsg.classList.remove('visible');
  });
});
</script>
</body>
</html>
